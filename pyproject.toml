[project]
name = "superforecasters"
version = "0.1.0"
description = "Find, score, and monitor the sharpest Finance/Economics traders on Polymarket and Kalshi."
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pandas>=2.0", "numpy>=1.24"]

[project.scripts]
sf = "superforecasters.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["superforecasters*"]
